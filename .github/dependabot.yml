# Monthly dependency updates, one grouped pull request per ecosystem, with
# Conventional Commits titles. Dependabot bumps only the base image in
# docker/Dockerfile: the SDK, Rust and Node pins there stay manual (Rust also
# lives in shell/rust-toolchain.toml; keep both in step).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /shell
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
