# Runs `make check` in the build container, through tools/dev.sh, exactly as a
# contributor does before opening a pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # tools/dev.sh tags the image with a hash of the Dockerfile and builds it
      # only when that tag is missing. Building the same tag here first lets
      # Buildx reuse cached layers, so the webOS SDK isn't downloaded every run.
      - name: Image tag
        id: image
        run: echo "tag=lumen-dev:$(sha256sum docker/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          tags: ${{ steps.image.outputs.tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: make check
        run: sh tools/dev.sh make check
