[package]
name = "lumen-remote"
description = "Lumen Remote's phone door on the TV: the web front-end and its WebSocket over HTTPS, paired, unprivileged, in front of lumen-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Only in src/sys.rs: dropping root (setgroups, setresgid, setresuid,
# no_new_privs), poll, SIGTERM, TCP keepalive, and getauxval for the TV.
libc.workspace = true
# The one thing Lumen does not write by hand: TLS 1.3 (rustls), with ring
# for its crypto, and ring's SHA-1 and SHA-256 for the WebSocket handshake
# and the pairing page's style hash.
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
