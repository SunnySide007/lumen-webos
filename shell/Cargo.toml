[workspace]
resolver = "3"
members = ["crates/lumen-core", "crates/lumen-shell"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
libloading = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
