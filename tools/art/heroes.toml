# The Top Shelf heroes: the scene that draws each file and its seed.
# tools/art/heroes.py reads this table; shell/assets/art/CREDITS.md lists it.
# A hero's name is its file name without .png. grain is film grain (the
# share of light it moves), peak the brightest light before the roll-off.

# Ambient (the screensaver): a still of the studio's aurora loop, as the 30 s
# loop at 24 fps has it at `frame`, with the scene's own seed, toned as the
# studio's previews are (peak_nits maps to white: the 1080p loop's MaxCLL).

[hero-ambient]
scene = "ambient"
source = "aurora"
seed = 2026
seconds = 30
fps = 24
frame = 0
peak_nits = 725.0

