[package]
name = "lumen-remote"
description = "Lumen Remote for Windows: a tray app that drives lumen-ctl on the TV over SSH"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

# Its own workspace: Tauri and WebView2 are Windows-only here, and the shell
# workspace is built for the TV too. The link to the TV, which make check
# tests, is lumen-remote-link in the shell workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
lumen-remote-link = { path = "../../shell/crates/lumen-remote-link" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "=2.12.3", features = ["tray-icon"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
